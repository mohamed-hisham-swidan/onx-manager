<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ONX Manager">
  <style>
    :root {
      --logo-bg: #101614;
      --logo-mark: #D6F25C;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --logo-bg: #08090e;
        --logo-mark: #38bdf8;
      }
    }
    .logo-bg { fill: var(--logo-bg); }
    .logo-stroke { stroke: var(--logo-mark); }
  </style>
  <rect width="64" height="64" rx="16" class="logo-bg" />
  <g fill="none" stroke-width="5.5" stroke-linecap="round" class="logo-stroke">
    <path d="M12 12 L52 52" />
    <path d="M52 12 L12 52" />
  </g>
  <circle cx="32" cy="32" r="13" class="logo-bg logo-stroke" stroke-width="5.5" />
</svg>
