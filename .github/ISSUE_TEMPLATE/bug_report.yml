name: Bug Report
description: Report a reproducible bug or unexpected behavior in ONX Manager
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Before submitting, please check existing issues to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Start ONX Manager with `onx start` (or `python3 launcher.py`)
        2. Navigate to `/servers/...`
        3. Click on ...
        4. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Component / Area
      options:
        - Backend API / WebSocket
        - Server Runtime (Docker / DooD)
        - Versioning & Branch Sandboxes
        - Frontend UI / Dashboard
        - File Manager / Plugins / Marketplace
        - Backups & Restore
        - Network Exposure (Playit / Cloudflare / UPnP)
        - Launcher / Installer / Docker Compose
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment (OS, Python, Node, Docker)
      description: "e.g., Ubuntu 24.04 / Windows 11, Python 3.12, Node 22, Docker 27.x"
      placeholder: "Linux (Ubuntu 24.04), Python 3.12, Node 22 LTS"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any backend tracebacks, browser console errors, or `onx logs` / `python3 launcher.py --logs` output (redact any secrets or tokens).
      render: shell
