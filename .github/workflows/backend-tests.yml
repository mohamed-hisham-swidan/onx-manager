name: Backend Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Run full backend test suite
        run: python -m pytest -q

      - name: Verify DB compatibility floor / migration head
        run: python ../scripts/check-db-revision

      - name: Lint gate — no new Ruff violations vs baseline
        run: python ../scripts/check-ruff-baseline
