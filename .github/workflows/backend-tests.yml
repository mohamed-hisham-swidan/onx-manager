name: Backend Tests

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run full backend test suite
        run: python -m pytest -q

      - name: Verify DB compatibility floor / migration head
        run: python ../scripts/check-db-revision

      - name: Lint gate — no new Ruff violations vs baseline
        run: python ../scripts/check-ruff-baseline

      - name: Verify PowerShell scripts UTF-8 BOM encoding
        run: python ../scripts/check-ps1-bom

      - name: Verify no stray SQLite DB files
        run: python ../scripts/check-stray-db
