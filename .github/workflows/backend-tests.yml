name: Backend Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run full backend test suite
        run: python -m pytest -q

      - name: Verify DB compatibility floor / migration head
        run: python ../scripts/check-db-revision

      - name: Lint gate — no new Ruff violations vs baseline
        run: python ../scripts/check-ruff-baseline

  docker-build-smoke:
    name: Docker Image Build & DooD CLI Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t onx-backend:ci ./backend

      - name: Smoke probe - verify static docker CLI binary
        run: docker run --rm --entrypoint /usr/local/bin/docker onx-backend:ci -v

      - name: Smoke probe - verify build tools excluded from final image
        run: |
          docker run --rm --entrypoint /bin/sh onx-backend:ci -c '
            set -e
            if which gcc >/dev/null 2>&1 || which cc >/dev/null 2>&1; then
              echo "FAIL: gcc/cc found in runtime image layer" >&2
              exit 1
            fi
            if [ -d /usr/include/python3.12 ] && [ "$(ls -A /usr/include/python3.12 2>/dev/null)" ]; then
              echo "FAIL: python3-dev headers found in runtime image layer" >&2
              exit 1
            fi
            echo "PASS: Final image is minimal and contains no C compiler or dev headers."
          '
