name: Verification Cadence

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  re-verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        run:
          - backend
          - frontend

    defaults:
      run:
        working-directory: ${{ matrix.run }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.run == 'backend'
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        if: matrix.run == 'backend'
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - uses: actions/setup-node@v4
        if: matrix.run == 'frontend'
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.run == 'frontend'
        run: npm ci

      - name: Verify version propagation
        if: matrix.run == 'backend'
        run: python ../scripts/check-version-propagation

      - name: Verify DB compatibility floor / migration head
        if: matrix.run == 'backend'
        run: python ../scripts/check-db-revision

      - name: Lint gate — no new Ruff violations vs baseline
        if: matrix.run == 'backend'
        run: python ../scripts/check-ruff-baseline

      - name: Verify route→permission contract matches live route table
        if: matrix.run == 'backend'
        run: python ../scripts/check-route-contract

      - name: Verify PowerShell scripts UTF-8 BOM encoding
        if: matrix.run == 'backend'
        run: python ../scripts/check-ps1-bom

      - name: Run full backend test suite
        if: matrix.run == 'backend'
        run: python -m pytest -q

      - name: Frontend typecheck
        if: matrix.run == 'frontend'
        run: npm run typecheck

      - name: Frontend lint
        if: matrix.run == 'frontend'
        run: npm run lint

      - name: Frontend test
        if: matrix.run == 'frontend'
        run: npm run test

      - name: Frontend build
        if: matrix.run == 'frontend'
        run: npm run build