name: Route/Permission Contract

on:
  push:
    branches: [master]
    paths:
      - "backend/app/api/**"
      - "backend/app/main.py"
      - "backend/app/registration.py"
      - "backend/app/websocket/**"
      - "contracts/permissions.yaml"
      - "scripts/check-route-contract"
      - ".github/workflows/route-permission-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/app/api/**"
      - "backend/app/main.py"
      - "backend/app/registration.py"
      - "backend/app/websocket/**"
      - "contracts/permissions.yaml"
      - "scripts/check-route-contract"
      - ".github/workflows/route-permission-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-contract:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Verify route→permission contract matches live route table
        run: python ../scripts/check-route-contract
