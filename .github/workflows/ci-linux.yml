name: Linux CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-lint:
    name: Contracts, DB & Lint (Linux)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Verify route/permission contract (219/219)
        run: python ../scripts/check-route-contract

      - name: Verify DB compatibility floor / migration head
        run: python ../scripts/check-db-revision

      - name: Verify version propagation
        run: python ../scripts/check-version-propagation

      - name: Lint gate — no new Ruff violations vs baseline
        run: python ../scripts/check-ruff-baseline

      - name: Verify PowerShell scripts UTF-8 BOM encoding
        run: python ../scripts/check-ps1-bom

      - name: Verify no stray SQLite DB files
        run: python ../scripts/check-stray-db

  backend-linux:
    name: Backend Tests (${{ matrix.shard.name }}, Linux)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: app-api
            args: "tests/api tests/application tests/auth tests/integration tests/tasks"
          - name: core-unit-infra
            args: "--ignore=tests/api --ignore=tests/application --ignore=tests/auth --ignore=tests/integration --ignore=tests/tasks tests"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run backend test suite (${{ matrix.shard.name }})
        run: python -m pytest -q --tb=short --durations=10 ${{ matrix.shard.args }}

  frontend-linux:
    name: Frontend Checks (Linux)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  desktop-linux:
    name: Desktop Checks (Linux)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm test
