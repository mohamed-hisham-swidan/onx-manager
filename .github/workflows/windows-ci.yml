# TEMPORARY: re-enable on path-filtered PRs after Windows test fixes; weekly red blocks release.
name: windows-ci

# Additive Windows coverage. Does NOT replace or modify the existing
# ubuntu-latest-only workflows (backend-tests.yml, backend-version-ci.yml,
# frontend-ci.yml, route-permission-ci.yml, verification-cadence.yml) —
# those keep running exactly as before. This workflow closes the Windows
# coverage gap identified on 2026-09-01: every existing workflow
# ran on ubuntu-latest only, so nothing was ever verified against a real
# Windows runner (the test suite mocks sys.platform=="win32" on Linux,
# which is not the same as actually running on Windows).
#
# P2-6c / D-P26-4: manual dispatch only. The owner runs this once on GitHub
# to verify Windows Simple-mode behavior; it must never block PRs or pushes.
# backend-windows runs the full backend suite and also calls out the Windows
# Simple-mode lifecycle and non-POSIX clean-export coverage explicitly.

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-windows:
    name: Backend tests (${{ matrix.shard.name }}, Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: app-api
            args: "tests/api tests/application tests/auth tests/integration tests/tasks"
          - name: core-unit-infra
            args: "--ignore=tests/api --ignore=tests/application --ignore=tests/auth --ignore=tests/integration --ignore=tests/tasks tests"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run backend test suite (${{ matrix.shard.name }})
        working-directory: backend
        # faulthandler_timeout is a hang TRAP, not a timeout: pytest's builtin
        # faulthandler plugin dumps every thread's stack to stderr if the run
        # stalls this long, then keeps going. Added after the 2026-09-10 stall
        # (19 passed, then ~39 min silence in TestServers::test_stop_server
        # with zero diagnostics). It cannot hang the run itself.
        run: python -m pytest -q --tb=short --durations=10 -o faulthandler_timeout=600 ${{ matrix.shard.args }}

      - name: Run Windows Simple-mode + non-POSIX clean-export tests
        if: matrix.shard.name == 'core-unit-infra'
        working-directory: backend
        # Explicitly re-run the Windows-only contract tests even though the
        # full suite above includes them, so the intent survives future suite
        # path filters or marker changes.
        run: python -m pytest -v --tb=short tests/test_windows_lifecycle_w01.py tests/infrastructure/test_clean_export.py

      - name: check-db-revision
        if: matrix.shard.name == 'core-unit-infra'
        working-directory: backend
        run: python ../scripts/check-db-revision

      - name: check-ruff-baseline
        if: matrix.shard.name == 'core-unit-infra'
        working-directory: backend
        run: python ../scripts/check-ruff-baseline

      - name: check-version-propagation
        if: matrix.shard.name == 'core-unit-infra'
        working-directory: backend
        run: python ../scripts/check-version-propagation

      - name: check-route-contract
        if: matrix.shard.name == 'core-unit-infra'
        working-directory: backend
        run: python ../scripts/check-route-contract

      - name: check-ps1-bom
        if: matrix.shard.name == 'core-unit-infra'
        run: python scripts/check-ps1-bom

  frontend-windows:
    name: Frontend checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
