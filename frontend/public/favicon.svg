<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ONX Manager">
  <style>
    :root {
      --fav-bg: #101614;
      --fav-mark: #D6F25C;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --fav-bg: #08090e;
        --fav-mark: #38bdf8;
      }
    }
    .fav-bg { fill: var(--fav-bg); }
    .fav-stroke { stroke: var(--fav-mark); }
  </style>
  <rect width="64" height="64" rx="16" class="fav-bg" />
  <g fill="none" stroke-width="5.5" stroke-linecap="round" class="fav-stroke">
    <path d="M12 12 L52 52" />
    <path d="M52 12 L12 52" />
  </g>
  <circle cx="32" cy="32" r="13" class="fav-bg fav-stroke" stroke-width="5.5" />
</svg>
