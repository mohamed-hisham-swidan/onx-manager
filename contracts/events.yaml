# Event Contract
# Every domain event schema.
# Registry rules:
# 1. New events are added to the catalog first before any module implements them.
# 2. Each event has a single authoritative publisher bounded context.
# 3. Event payloads are additive only (never remove fields).
# 4. Schema changes require incrementing version / schema_version in the payload.

version: 1.0

event_envelope:
  id: uuid
  type: string  # dot-notation: "server.crashed"
  version: integer  # schema version, starts at 1
  timestamp: datetime
  source: string  # bounded context / module that published
  correlation_id: uuid
  payload: object  # event-specific

events:
  server.created:
    version: 1
    payload:
      server_id: string
      name: string
      version: string

  server.started:
    version: 1
    payload:
      server_id: string
      pid: integer
      port: integer

  server.crashed:
    version: 1
    payload:
      server_id: string
      exit_code: integer?
      last_log_lines: string[]

  backup.completed:
    version: 2
    payload:
      backup_id: string
      server_id: string
      size_bytes: integer
      size_human: string
      checksum_sha256: string
      checksum_algorithm: string

  plugin.installed:
    version: 1
    payload:
      plugin_id: string
      server_id: string
      version: string

  user.login:
    version: 1
    payload:
      user_id: string
      ip_address: string
      timestamp: datetime

  circuit.opened:
    version: 1
    payload:
      provider_name: string
      failure_count: integer
      window_seconds: integer

  operation.started:
    version: 1
    payload:
      operation_id: string
      event_seq: integer
      type: string
      target_type: string
      target_id: string?
      server_id: string?
      actor_id: string?
      created_at: float

  operation.step:
    version: 1
    payload:
      operation_id: string
      event_seq: integer
      server_id: string?
      step_id: string
      sequence: integer
      status: string
      progress: float?
      elapsed_ms: integer
      message_key: string?
      safe_to_retry: boolean
      context: object

  operation.log:
    version: 1
    payload:
      operation_id: string
      event_seq: integer
      server_id: string?
      step_id: string?
      level: string
      message: string
      timestamp: float

  operation.completed:
    version: 1
    payload:
      operation_id: string
      event_seq: integer
      target_type: string
      target_id: string?
      server_id: string?
      type: string
      elapsed_ms: integer
      finished_at: float

  operation.failed:
    version: 1
    payload:
      operation_id: string
      event_seq: integer
      target_type: string
      target_id: string?
      server_id: string?
      type: string
      failure_code: string
      error_message: string
      failed_step_id: string?
      elapsed_ms: integer
      finished_at: float

  operation.cancelled:
    version: 1
    payload:
      operation_id: string
      event_seq: integer
      target_type: string
      target_id: string?
      server_id: string?
      type: string
      elapsed_ms: integer
      finished_at: float
