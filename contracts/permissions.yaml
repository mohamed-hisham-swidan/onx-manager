# Permission Contract
# All permission strings and their meanings.

version: 1.6
# ─────────────────────────────────────────────────────────────────────────────
# NOTE (generated 2026-08-02, updated 2026-08-04, Phase 1 §3.1 audit):
# this file now also carries a route→permission coverage matrix
# (`route_permissions`), generated from a runtime introspection of the LIVE
# FastAPI route table. It documents the CURRENT real enforcement state, not an
# aspirational target.
#
# Status values:
#   enforced              -> a `require_permission(...)` dependency is attached
#                            to the route today.
#   enforced-external     -> real authorization gate exists but is structurally
#                            different from require_permission(...) (e.g. the
#                            WebSocket handshake/subscription model).
#   missing               -> route is auth-gated (or public) but has no
#                            permission check; a required permission is listed.
#   not-applicable-public -> route is intentionally public/unauthenticated.
#
# Permission mapping policy (2026-08-02): routes that have no dedicated
# permission in the `permissions:` catalog are folded onto the closest existing
# resource:action permission (e.g. per-server reads -> server:read, global
# cron/config writes -> settings:write). No new permission names are introduced
# in Phase 1; a finer-grained model belongs to the Phase 2 redesign. See
# docs/PERMISSIONS_FUTURE_IDEAS.md.
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  server:read:
    description: View server details and status
    scope: server_id

  server:write:
    description: Modify server configuration
    scope: server_id

  server:start:
    description: Start a server
    scope: server_id

  server:stop:
    description: Stop a server
    scope: server_id

  server:delete:
    description: Delete a server
    scope: server_id

  backup:read:
    description: View backup list and details
    scope: server_id

  backup:create:
    description: Create backups
    scope: server_id

  backup:restore:
    description: Restore from backup
    scope: server_id

  backup:delete:
    description: Delete backups
    scope: server_id

  plugin:read:
    description: View installed plugins
    scope: server_id

  plugin:install:
    description: Install new plugins
    scope: server_id

  plugin:manage:
    description: Enable/disable/uninstall plugins
    scope: server_id

  user:read:
    description: View user list
    scope: global

  user:write:
    description: Create/edit users
    scope: global

  user:delete:
    description: Delete users
    scope: global

  settings:read:
    description: View system settings
    scope: global

  settings:write:
    description: Modify system settings
    scope: global

  exposure.credentials.manage:
    description: Generate/reset/remove host agent credentials and trigger reconciliation
    scope: global
    note: Owner-only intent — routes additionally guarded by require_owner() for claim/reset/remove

  exposure.global.stop:
    description: Stop all exposures instance-wide (keeps credentials)
    scope: global

  exposure.panel.manage:
    description: Read and configure the instance panel exposure
    scope: global

  server.{id}.exposure:
    description: Manage a server's exposure configuration and targets
    scope: server_id

  server.{id}.exposure.view:
    description: View a server's exposure configuration, status, and public addresses
    scope: server_id

  server:version:read:
    description: View server branches, commit history, and test run status
    scope: server_id

  server:version:commit:
    description: Create server branches and version commits
    scope: server_id

  server:test:execute:
    description: Launch and discard isolated server tests
    scope: server_id

  server:test:configure:
    description: Configure bot verification and test parameters
    scope: server_id

  server:version:promote:
    description: Promote a commit or test run to production
    scope: server_id

  server:history:read:
    description: View server operational activity logs and change history
    scope: server_id

  admin:full:
    description: Unrestricted access
    scope: global

roles:
  viewer:
    permissions: [server:read, backup:read, plugin:read, server:version:read]

  operator:
    permissions:
      - server:read, server:write, server:start, server:stop
      - backup:read, backup:create
      - plugin:read, plugin:install, plugin:manage
      - server:version:read, server:version:commit, server:test:execute, server:test:configure, server:version:promote

  admin:
    permissions: [admin:full]

# ─────────────────────────────────────────────────────────────────────────────
# ROUTE → PERMISSION COVERAGE MATRIX (generated 2026-08-02, updated 2026-08-13)
# Live introspection: 99 effective routes (excl. HEAD/OPTIONS), FastAPI 0.139.
#   43 mutating -> 37 enforced, 5 intentionally public (login, refresh,
#                  bootstrap, create_user, invites/accept), 1 missing (logout)
#   41 GET      -> 14 enforced, 12 not-applicable-public, 15 auth-only/missing
#    1 WebSocket -> /ws, status enforced-external (real gate, non-functional
#                  due to namespace mismatch — see entry note)
# ─────────────────────────────────────────────────────────────────────────────
route_permissions:

  # ── Mutating routes ─────────────────────────────────────────────────────────
  # servers
  "POST /api/v1/servers": {permission: "server:create", status: enforced, note: "member/users create servers and become owner_id (roadmap §2.2)"}
  "POST /api/v1/servers/scan": {permission: "server:write", status: enforced}
  "POST /api/v1/servers/import": {permission: "server:write", status: enforced}
  "POST /api/v1/servers/import/upload": {permission: "server:write", status: enforced}
  "PATCH /api/v1/servers/{server_id}": {permission: "server:write", status: enforced}
  "DELETE /api/v1/servers/{server_id}": {permission: "server:delete", status: enforced}
  "POST /api/v1/servers/{server_id}/start": {permission: "server.{id}.power", status: enforced, note: "server-scoped power control (owner/admin/dev; viewer denied)"}
  "POST /api/v1/servers/{server_id}/stop": {permission: "server.{id}.power", status: enforced, note: "server-scoped power control (owner/admin/dev; viewer denied)"}
  "POST /api/v1/servers/{server_id}/restart": {permission: "server.{id}.power", status: enforced, note: "server-scoped power control (owner/admin/dev; viewer denied)"}
  "POST /api/v1/servers/{server_id}/retry-provisioning": {permission: "server.{id}.write", status: enforced, note: "retry failed provisioning; server-scoped write"}
  "POST /api/v1/servers/{server_id}/command": {permission: "server.{id}.console", status: enforced, note: "console command execution; server-scoped via require_server_permission (server admin/dev; viewer denied)"}
  "POST /api/v1/servers/runtime/ownership/claim": {permission: "server:write", status: enforced}
  "POST /api/v1/servers/reconcile": {permission: "server:write", status: enforced}
  "POST /api/v1/servers/refresh": {permission: "server:write", status: enforced}

  # backups
  "POST /api/v1/backups": {permission: "backup:create", status: enforced}
  "DELETE /api/v1/backups/{backup_id}": {permission: "backup:delete", status: enforced}
  "POST /api/v1/backups/{backup_id}/restore": {permission: "backup:restore", status: enforced}
  "POST /api/v1/backups/{backup_id}/verify": {permission: "backup:read", status: enforced, note: "integrity check; reuse existing backup:read (no new backup:verify)"}

  # plugins
  "DELETE /api/v1/servers/{server_id}/plugins/{plugin_id}": {permission: "plugin:manage, server.{id}.plugins", status: enforced}
  "POST /api/v1/servers/{server_id}/plugins/{plugin_id}/enable": {permission: "plugin:manage, server.{id}.plugins", status: enforced}
  "POST /api/v1/servers/{server_id}/plugins/{plugin_id}/disable": {permission: "plugin:manage, server.{id}.plugins", status: enforced}
  "POST /api/v1/servers/{server_id}/plugins/toggle": {permission: "plugin:manage, server.{id}.plugins", status: enforced}
  "POST /api/v1/servers/{server_id}/plugins/upload": {permission: "plugin:manage, server.{id}.plugins", status: enforced}

  # plugins — Modrinth marketplace (verified enforced against plugins.py:73,85,120)
  "GET /api/v1/servers/{server_id}/plugins/marketplace/search": {permission: "plugin:manage, server.{id}.plugins, server.{id}.view", status: enforced}
  "GET /api/v1/servers/{server_id}/plugins/marketplace/projects/{project_id}/versions": {permission: "plugin:manage, server.{id}.plugins, server.{id}.view", status: enforced}
  "POST /api/v1/servers/{server_id}/plugins/marketplace/install": {permission: "plugin:manage, server.{id}.plugins", status: enforced}

  # plugins — top-level marketplace (global search / project detail, no server context)
  "GET /api/v1/marketplace/search": {permission: "plugin:manage", status: enforced, note: "top-level global marketplace search; plugin:manage-gated (B6-4)"}
  "GET /api/v1/marketplace/projects/{project_id}": {permission: "plugin:manage", status: enforced, note: "top-level marketplace project detail; plugin:manage-gated (B6-4)"}
  "GET /api/v1/marketplace/projects/{project_id}/versions": {permission: "plugin:manage", status: enforced, note: "top-level marketplace project versions; plugin:manage-gated (SPEC-PLUGIN-DETAIL-TABS-001)"}

  # files — server-scoped file management
  "GET /api/v1/servers/{server_id}/files": {permission: "server.{id}.files", status: enforced}
  "GET /api/v1/servers/{server_id}/files/content": {permission: "server.{id}.files", status: enforced, note: "server.properties read denied for all (holds rcon.password)"}
  "PUT /api/v1/servers/{server_id}/files/content": {permission: "server.{id}.files", status: enforced, note: "server.properties write allowed (accepted boundary: files role == full server file management)"}
  "DELETE /api/v1/servers/{server_id}/files": {permission: "server.{id}.files", status: enforced}
  "POST /api/v1/servers/{server_id}/files/upload": {permission: "server.{id}.files", status: enforced}
  "GET /api/v1/servers/{server_id}/files/download": {permission: "server.{id}.files", status: enforced, note: "server.properties download denied for all (holds rcon.password)"}

  "POST /api/v1/servers/{server_id}/files/mkdir": {permission: "server.{id}.files", status: enforced}

  # versioning
  "POST /api/v1/servers/{server_id}/versioning/branches": {permission: "server:version:commit", status: enforced}
  "POST /api/v1/servers/{server_id}/versioning/commits": {permission: "server:version:commit", status: enforced}
  "POST /api/v1/servers/{server_id}/versioning/tests": {permission: "server:test:execute", status: enforced}
  "POST /api/v1/servers/{server_id}/versioning/tests/{test_id}/promote": {permission: "server:version:promote", status: enforced}
  "POST /api/v1/servers/{server_id}/versioning/tests/{test_id}/discard": {permission: "server:test:execute", status: enforced}
  "PUT /api/v1/servers/{server_id}/versioning/settings": {permission: "server:test:configure", status: enforced}


  # auth
  "POST /api/v1/auth/login": {permission: null, status: not-applicable-public}
  "POST /api/v1/auth/refresh": {permission: null, status: not-applicable-public}
  "POST /api/v1/auth/logout": {permission: null, status: missing, note: "self-service on own session; auth-only is sufficient, no resource permission needed"}
  "POST /api/v1/auth/api-keys": {permission: "user:write", status: enforced}
  "DELETE /api/v1/auth/api-keys/{api_key_id}": {permission: "user:write", status: enforced}

  # users
  "POST /api/v1/users": {permission: null, status: not-applicable-public, note: "intentionally open registration (AuthMiddleware._public_post_only, app/api/v1/middleware/auth.py:25-27). First-user bootstrap fix investigated 2026-08-02 and DEFERRED — docs/API.md:471 + docs/getting-started.md:55 rely on open registration, User.create assigns no roles (no implicit-admin mechanism exists), and tests would need broad changes. See docs/PERMISSIONS_FUTURE_IDEAS.md §5."}
  "PATCH /api/v1/users/{user_id}": {permission: "user:write", status: enforced}
  "DELETE /api/v1/users/{user_id}": {permission: "user:delete", status: enforced}

  # monitoring
  "POST /api/v1/monitoring/alerts/{server_id}": {permission: "server.{id}.settings", status: enforced}
  "DELETE /api/v1/monitoring/alerts/{alert_rule_id}": {permission: "global.settings", status: enforced}

  # health
  "POST /api/v1/health/evaluate/{server_id}": {permission: "server.{id}.view", status: enforced}

  # schedules
  "POST /api/v1/schedules": {permission: "global.settings", status: enforced}
  "DELETE /api/v1/schedules/{schedule_id}": {permission: "global.settings", status: enforced}


  # settings
  "PATCH /api/v1/settings": {permission: "settings:write", status: enforced}

  # exposure — instance/Owner actions (Batch 7.1)
  "GET /api/v1/exposure/agent": {permission: "exposure.credentials.manage", status: enforced, note: "host agent status; never returns secrets"}
  "POST /api/v1/exposure/agent/claim": {permission: "owner", status: enforced, note: "Owner-only via require_owner(); generates claim code"}
  "POST /api/v1/exposure/agent/reset": {permission: "owner", status: enforced, note: "Owner-only via require_owner()"}
  "POST /api/v1/exposure/agent/reconcile": {permission: "exposure.credentials.manage", status: enforced}
  "POST /api/v1/exposure/stop-all": {permission: "owner", status: enforced, note: "Owner-only via require_owner()"}
  "POST /api/v1/exposure/credentials/remove": {permission: "owner", status: enforced, note: "Owner-only via require_owner()"}
  "GET /api/v1/exposure/panel": {permission: "owner", status: enforced, note: "Owner-only via require_owner() — admin:full alone NOT sufficient (7.2a Decision 4); exposure.panel.manage remains documented but does not gate the route"}
  "PUT /api/v1/exposure/panel": {permission: "owner", status: enforced, note: "Owner-only via require_owner() — admin:full alone NOT sufficient; idempotent set method + desired_state; cloudflare_tunnel enable requires token+hostname"}

  # exposure — server-scoped (Batch 7.1)
  "GET /api/v1/servers/{server_id}/exposure": {permission: "server.{id}.exposure.view", status: enforced}
  "PUT /api/v1/servers/{server_id}/exposure": {permission: "server.{id}.exposure", status: enforced, note: "create/update method + desired_state; NO_TARGETS on enable → 422"}
  "PATCH /api/v1/servers/{server_id}/exposure": {permission: "server.{id}.exposure", status: enforced, note: "enable/disable; idempotent transitions"}
  "DELETE /api/v1/servers/{server_id}/exposure": {permission: "server.{id}.exposure", status: enforced, note: "204 idempotent; removes exposure config"}
  "GET /api/v1/servers/{server_id}/exposure/targets": {permission: "server.{id}.exposure.view", status: enforced}
  "POST /api/v1/servers/{server_id}/exposure/targets": {permission: "server.{id}.exposure", status: enforced, note: "create java target from ServerModel.port; validates port + deny-list"}
  "PUT /api/v1/servers/{server_id}/exposure/targets/{target_id}": {permission: "server.{id}.exposure", status: enforced, note: "update exposure target public_address"}
  "GET /api/v1/servers/{server_id}/ports": {permission: "server.{id}.exposure.view", status: enforced}
  "POST /api/v1/servers/{server_id}/ports": {permission: "server.{id}.exposure", status: enforced, note: "register companion port; validates deny-list and single port per type"}
  "DELETE /api/v1/servers/{server_id}/ports/{port_id}": {permission: "server.{id}.exposure", status: enforced, note: "204 idempotent; deletes registered companion port and removes associated exposure target"}

  "POST /api/v1/setup/bootstrap": {permission: null, status: not-applicable-public, note: "single-use first-run wizard; rejects with 409/400 once instance initialized"}
  "PUT /api/v1/setup/access-mode": {permission: "owner", status: enforced, note: "Owner-only via require_owner() — admin:full alone is NOT sufficient; requires owner role or global.* claim"}

  # invites
  "POST /api/v1/invites": {permission: "user:write", status: enforced, note: "invitation issuance gated; handler also enforces owner/admin/server privilege checks on requested roles"}
  "DELETE /api/v1/invites/{invite_id}": {permission: "user:write", status: enforced, note: "revokes an invitation"}
  "POST /api/v1/invites/accept": {permission: null, status: not-applicable-public, note: "token-based registration replacing open /users self-registration"}

  # ── Read (GET) routes ───────────────────────────────────────────────────────
  # Public / no permission needed
  "GET /openapi.json": {permission: null, status: not-applicable-public}
  "GET /docs": {permission: null, status: not-applicable-public}
  "GET /docs/oauth2-redirect": {permission: null, status: not-applicable-public}
  "GET /redoc": {permission: null, status: not-applicable-public}
  "GET /.well-known/jwks.json": {permission: null, status: not-applicable-public}
  "GET /health": {permission: null, status: not-applicable-public}
  "GET /metrics": {permission: null, status: not-applicable-public, note: "Prometheus scrape endpoint; intentionally public but exposes operational gauges"}
  "GET /api/v1/servers/available-port": {permission: null, status: not-applicable-public, note: "auth-only is sufficient; reveals free port only"}
  "GET /api/v1/software": {permission: null, status: not-applicable-public, note: "static software metadata; auth-only is sufficient"}
  "GET /api/v1/software/{software_type}/versions": {permission: null, status: not-applicable-public, note: "version list; auth-only is sufficient"}

  # setup
  "GET /api/v1/setup/status": {permission: null, status: not-applicable-public, note: "instance initialization state (initialized/access_mode/user_count); used by the setup wizard and SystemStatusGuard"}

  # invites
  "GET /api/v1/invites": {permission: "user:write", status: enforced}
  "POST /api/v1/invites/verify": {permission: null, status: not-applicable-public, note: "pre-registration token validity check"}

  # Sensitive reads — permission check needed (currently auth-only = missing)
  "GET /api/v1/servers": {permission: "server:read", status: missing}
  "GET /api/v1/servers/{server_id}": {permission: "server:read", status: missing}
  "GET /api/v1/servers/{server_id}/console": {permission: "server.{id}.view", status: enforced, note: "console log history — server-scoped read via require_server_permission (viewer can read; command execution denied)"}
  "GET /api/v1/servers/{server_id}/crash-reports": {permission: "server.{id}.view", status: enforced, note: "server crash reports list via require_server_permission"}
  "GET /api/v1/servers/{server_id}/activity": {permission: "server.{id}.view", status: enforced, note: "server activity log history via require_server_permission"}
  "GET /api/v1/servers/{server_id}/runtime": {permission: "server.{id}.view", status: enforced, note: "server-scoped runtime diagnostics via require_server_permission (owner/admin/dev/viewer membership; non-members denied)"}
  "GET /api/v1/servers/runtime/ownership": {permission: "server:read", status: enforced, note: "host runtime/PID/tmux snapshot; requires global server:read (owner/admin/operator/viewer); members without server:read denied"}
  "GET /api/v1/servers/{server_id}/runtime/validate": {permission: "server.{id}.view", status: enforced, note: "server-scoped runtime validation chain via require_server_permission"}
  "GET /api/v1/backups": {permission: "backup:read", status: missing}
  "GET /api/v1/backups/{backup_id}": {permission: "backup:read", status: missing}
  "GET /api/v1/servers/{server_id}/plugins": {permission: "server.{id}.plugins, server.{id}.view", status: enforced}
  "GET /api/v1/servers/{server_id}/plugins/{plugin_id}": {permission: "server.{id}.plugins, server.{id}.view", status: enforced}
  "GET /api/v1/auth/me": {permission: "user:read", status: missing, note: "own profile; auth-only may be acceptable but classified sensitive"}
  "GET /api/v1/auth/api-keys": {permission: "user:read", status: missing, note: "API-key metadata incl. permission sets"}
  "GET /api/v1/users": {permission: "user:read", status: missing, note: "full user list — email/display names"}
  "GET /api/v1/users/{user_id}": {permission: "user:read", status: missing}
  "GET /api/v1/monitoring/metrics": {permission: "server.{id}.view", status: enforced, note: "per-server metrics; server-scoped read via require_server_permission"}
  "GET /api/v1/monitoring/alerts": {permission: "server:read", status: missing, note: "per-server alert rules; reuse existing server:read"}
  "GET /api/v1/health/status/{server_id}": {permission: "server:read", status: missing, note: "per-server health; reuse existing server:read"}
  "GET /api/v1/health/timeline/{server_id}": {permission: "server:read", status: missing, note: "per-server health timeline; reuse existing server:read"}
  "GET /api/v1/health/dashboard": {permission: "server:read", status: missing, note: "aggregate of server health; reuse existing server:read"}
  "GET /api/v1/schedules": {permission: "settings:read", status: missing, note: "global cron jobs; reuse existing settings:read"}
  "GET /api/v1/settings": {permission: "settings:read", status: enforced}

  # versioning
  "GET /api/v1/servers/{server_id}/versioning/branches": {permission: "server:version:read", status: enforced}
  "GET /api/v1/servers/{server_id}/versioning/commits": {permission: "server:version:read", status: enforced}
  "GET /api/v1/servers/{server_id}/versioning/tests/{test_id}": {permission: "server:version:read", status: enforced}
  "GET /api/v1/servers/{server_id}/versioning/settings": {permission: "server:version:read", status: enforced}
  "GET /api/v1/servers/{server_id}/versioning/preflight": {permission: "server:version:read", status: enforced}

  # ── WebSocket ───────────────────────────────────────────────────────────────
  # Status verified by code trace (2026-08-09). Evidence:
  #   - Handshake token check BEFORE accept: app/websocket/endpoint.py
  #   - Per-channel gate at subscribe time: app/websocket/authorization.py
  #   - RESOLVED (Phase 3, commit b98da77/d096f75): plural/singular permission mismatch fixed
  #     (CHANNEL_PATTERNS uses singular permissions server:read, backup:read, plugin:read, user:read),
  #     admin:full bypass added, 3-part channel validation supported.
  "WS /ws": {permission: null, status: enforced-external, note: "real handshake + subscription-time channel gate; K1/K2 resolved in Phase 3 (b98da77, d096f75, db1889d)"}
