[project]
name = "onx-manager"
version = "0.1.0"
description = "onx-manager — backend engine"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"

dependencies = [
    "aiohttp>=3.9.0",
    "aioboto3>=15.5.0",
    "aiosqlite>=0.20.0",
    "aioupnp>=0.0.18; sys_platform != 'win32'",
    "netifaces-plus>=0.12.0; sys_platform == 'win32'",
    "defusedxml>=0.7.0; sys_platform == 'win32'",
    "alembic>=1.13.0",
    "APScheduler>=3.10.0",
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "packaging>=23.0",
    "prometheus-client>=0.20.0",
    "psutil>=7.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "structlog>=24.1.0",
    "tomli-w==1.2.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff==0.16.0",
    "pyright>=1.1.350",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "plugins*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning:fastapi\\.testclient",
]
markers = [
    "docker: marks tests that require or interact with a live Docker daemon",
    "no_isolated_db: opt out of root autouse in-memory DB isolation fixture for tests managing their own engine/database",
    "allow_real_signals: opt out of test signal safety guard for tests that intentionally signal real processes",
]
